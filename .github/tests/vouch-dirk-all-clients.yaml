participants:
  # Vouch 1 (active, accounts 0-63) — lighthouse/geth
  - el_type: geth
    cl_type: lighthouse
    cl_extra_params: ['--subscribe-all-subnets']
    vc_type: vouch
    vc_image: vouch:local
    use_separate_vc: true
    validator_count: 64
    dirk_peer_count: 3
    dirk_signing_threshold: 2
    dirk_image: dirk:local
    vouch_multiinstance_style: 'static-delay'
    vouch_multiinstance_attester_delay: '0s'
    vouch_multiinstance_proposer_delay: '0s'
    vc_beacon_node_indices: [0, 1, 2, 3, 4, 5, 6]

  # Vouch 2 (passive/standby, shares accounts 0-63) — teku/nethermind
  - el_type: nethermind
    cl_type: teku
    cl_extra_params: ['--p2p-subscribe-all-subnets-enabled=true']
    vc_type: vouch
    vc_image: vouch:local
    use_separate_vc: true
    validator_count: 0
    vouch_multiinstance_style: 'static-delay'
    vouch_multiinstance_attester_delay: '1s'
    vouch_multiinstance_proposer_delay: '2s'
    vouch_account_start: 0
    vouch_account_count: 64
    vc_beacon_node_indices: [0, 1, 2, 3, 4, 5, 6]

  # Vouch 3 (separate account range 64-127, same Dirk cluster) — prysm/geth
  - el_type: geth
    cl_type: prysm
    cl_extra_params: ['--subscribe-all-subnets=true']
    vc_type: vouch
    vc_image: vouch:local
    use_separate_vc: true
    validator_count: 64
    dirk_peer_count: 3
    dirk_signing_threshold: 2
    dirk_image: dirk:local
    vc_beacon_node_indices: [0, 1, 2, 3, 4, 5, 6]

  # CL-only peers (no validators, for client diversity)
  - el_type: nethermind
    cl_type: lodestar
    validator_count: 0
  - el_type: geth
    cl_type: nimbus
    validator_count: 0
  - el_type: nethermind
    cl_type: grandine
    validator_count: 0
  - el_type: erigon
    cl_type: lighthouse
    validator_count: 0

network_params:
  preset: mainnet
  seconds_per_slot: 6
  num_validator_keys_per_node: 128

additional_services:
  - prometheus_grafana
  - dora
  - assertoor

assertoor_params:
  run_stability_check: true
  run_block_proposal_check: true
